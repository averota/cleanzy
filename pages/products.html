<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/styles.css?v=3">
  <script src="../assets/js/sidebar-init.js?v=2"></script>
</head>
<body data-page="products">
  <div class="app-shell" id="appShell">
    <!-- Sidebar: fixed rail on desktop, Bootstrap offcanvas on phones (filled by sidebar.js) -->
    <aside class="app-sidebar offcanvas-md offcanvas-start" id="sidebarRoot" tabindex="-1" aria-label="Main menu"></aside>

    <div class="app-main">
      <header class="page-topbar d-flex align-items-center gap-2 px-3 px-md-4 bg-white border-bottom">
        <button type="button" class="btn btn-outline-secondary btn-sm d-md-none" data-bs-toggle="offcanvas" data-bs-target="#sidebarRoot" aria-controls="sidebarRoot" aria-label="Open menu"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
        <h1 class="page-title h5 mb-0">Products</h1>
      </header>

      <main class="page-content p-3 p-md-4">
        <nav class="nav nav-tabs flex-nowrap overflow-x-auto no-scrollbar mb-3" id="tabs" role="tablist" aria-label="Product sections"></nav>
        <nav class="nav nav-pills gap-1 mb-3 hidden" id="subTabs" role="tablist" aria-label="Sub-sections"></nav>

        <div id="layout">
          <!-- List -->
          <section class="card">
            <div class="card-header panel-head">
              <h2 class="h6 mb-0" id="listTitle">Products</h2>
              <div class="d-flex flex-wrap align-items-center gap-2">
                <span class="small hidden" id="rateInfo"></span>
                <input class="form-control form-control-sm w-auto" type="search" id="search" placeholder="Search…" aria-label="Search">
                <div class="form-check mb-0" id="inactiveWrap">
                  <input class="form-check-input" type="checkbox" id="showInactive" autocomplete="off">
                  <label class="form-check-label small" for="showInactive">Show inactive</label>
                </div>
                <button type="button" class="btn btn-sm btn-outline-success" id="exportBtn"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-1" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"></path></svg>Export Excel</button>
                <button type="button" class="btn btn-sm btn-primary hidden" id="newBtn">+ New</button>
              </div>
            </div>
            <p class="small px-3 pt-2 mb-0 hidden" id="note"></p>
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead id="listHead"></thead>
                <tbody id="listBody"><tr><td class="empty">Loading…</td></tr></tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <!-- Item form, set price, new exchange rate (modal) -->
  <div class="modal fade" id="sidePanel" tabindex="-1" aria-labelledby="formTitle" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h6" id="formTitle">New</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="form" novalidate>
        <div class="modal-body">
                <fieldset id="itemFields"></fieldset>

                <!-- Price / rate fields -->
                <fieldset id="pricePane" class="hidden">
                  <p class="fw-semibold mb-3" id="targetLabel"></p>

                  <div id="priceFields">
                    <div class="mb-2">
                      <label class="form-label" for="fAmount">Amount *</label>
                      <input class="form-control form-control-sm" type="number" id="fAmount" min="0" step="any" inputmode="decimal">
                    </div>
                    <div class="mb-2">
                      <p class="form-label">Currency</p>
                      <div class="btn-group btn-group-sm" role="group" aria-label="Currency"><input type="radio" class="btn-check" name="currency" id="cur0" value="KHR" checked><label class="btn btn-outline-primary" for="cur0">៛ KHR</label><input type="radio" class="btn-check" name="currency" id="cur1" value="USD"><label class="btn btn-outline-primary" for="cur1">$ USD</label></div>
                    </div>
                  </div>

                  <div id="rateFields" class="hidden">
                    <div class="mb-2">
                      <label class="form-label" for="fRate">Riel (៛) for 1 USD *</label>
                      <input class="form-control form-control-sm" type="number" id="fRate" min="0" step="any" inputmode="decimal">
                    </div>
                  </div>

                  <div class="mb-2">
                    <p class="form-label">Effective</p>
                    <div class="btn-group btn-group-sm" role="group" aria-label="Effective"><input type="radio" class="btn-check" name="when" id="when0" value="now" checked><label class="btn btn-outline-primary" for="when0">Now</label><input type="radio" class="btn-check" name="when" id="when1" value="later"><label class="btn btn-outline-primary" for="when1">Schedule</label></div>
                    <input class="form-control form-control-sm mt-2 hidden" type="datetime-local" id="fWhen" aria-label="Effective date and time">
                  </div>

                  <div class="mb-2">
                    <label class="form-label" for="fRemark">Remark (optional)</label>
                    <input class="form-control form-control-sm" id="fRemark" autocomplete="off">
                  </div>

                  <p class="small" id="preview"></p>
                </fieldset>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
        </div>
      </form>
      </div>
    </div>
  </div>

  <!-- Row details (opens when a row is clicked): fields, price history, all action buttons -->
  <div class="modal fade" id="detailPanel" tabindex="-1" aria-labelledby="detailTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h6" id="detailTitle">Details</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="detailBody"></div>
        <div class="modal-footer flex-wrap justify-content-start gap-1 hidden" id="detailActions"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="../assets/config.js"></script>
  <script src="../assets/js/supabaseClient.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/sidebar.js?v=2"></script>
  <script src="../assets/js/ui.js?v=5"></script>
  <script src="../assets/js/products.js?v=5"></script>
</body>
</html>
