<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/styles.css?v=5">
  <script src="../assets/js/sidebar-init.js?v=2"></script>
</head>
<body data-page="reports">
  <div class="app-shell" id="appShell">
    <!-- Sidebar: fixed rail on desktop, Bootstrap offcanvas on phones (filled by sidebar.js) -->
    <aside class="app-sidebar offcanvas-md offcanvas-start" id="sidebarRoot" tabindex="-1" aria-label="Main menu"></aside>

    <div class="app-main">
      <header class="page-topbar d-flex align-items-center gap-2 px-3 px-md-4 bg-white border-bottom">
        <button type="button" class="btn btn-outline-secondary btn-sm d-md-none" data-bs-toggle="offcanvas" data-bs-target="#sidebarRoot" aria-controls="sidebarRoot" aria-label="Open menu"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
        <h1 class="page-title h5 mb-0">Reports</h1>
      </header>

      <main class="page-content p-3 p-md-4">
        <p class="empty hidden" id="noAccess">You do not have permission to view reports.</p>

        <div id="reportRoot" class="hidden">
          <!-- 1. Filters -->
          <section class="card mb-3" aria-label="Filters">
            <div class="card-body py-3">
              <div class="row g-2">
                <div class="col-6 col-md-3"><label class="form-label" for="fFrom">From</label><input class="form-control form-control-sm" type="date" id="fFrom"></div>
                <div class="col-6 col-md-3"><label class="form-label" for="fTo">To</label><input class="form-control form-control-sm" type="date" id="fTo"></div>
                <div class="col-6 col-md-3">
                  <label class="form-label" for="fStatus">Status</label>
                  <select class="form-select form-select-sm" id="fStatus">
                    <option value="">Pending + Confirmed</option>
                    <option>Confirmed</option>
                    <option>Pending</option>
                  </select>
                </div>
                <div class="col-6 col-md-3">
                  <label class="form-label" for="fPayment">Payment</label>
                  <select class="form-select form-select-sm" id="fPayment"><option value="">All</option><option>Cash</option><option>Bank</option></select>
                </div>
              </div>
              <div class="filter-actions d-flex flex-wrap align-items-center gap-2 mt-2">
                <span class="small">Quick:</span>
                <button type="button" class="btn btn-link btn-sm p-0" data-preset="today">Today</button>
                <button type="button" class="btn btn-link btn-sm p-0" data-preset="yesterday">Yesterday</button>
                <button type="button" class="btn btn-link btn-sm p-0" data-preset="month">This month</button>
                <button type="button" class="btn btn-link btn-sm p-0" data-preset="lastMonth">Last month</button>
                <span class="small" id="rangeSummary"></span>
              </div>
            </div>
          </section>

          <!-- 2. Stat cards -->
          <section class="row row-cols-1 row-cols-sm-2 row-cols-xl-5 g-3 mb-3" aria-label="Summary">
            <div class="col"><div class="card h-100"><div class="card-body py-3"><p class="stat-label">Net revenue</p><p class="stat-value" id="statNet">—</p><p class="stat-sub" id="statNetSub"></p></div></div></div>
            <div class="col"><div class="card h-100"><div class="card-body py-3"><p class="stat-label">Receipts</p><p class="stat-value" id="statReceipts">—</p><p class="stat-sub" id="statReceiptsSub"></p></div></div></div>
            <div class="col"><div class="card h-100"><div class="card-body py-3"><p class="stat-label">Gross</p><p class="stat-value" id="statGross">—</p><p class="stat-sub">Before discounts</p></div></div></div>
            <div class="col"><div class="card h-100"><div class="card-body py-3"><p class="stat-label">Discounts</p><p class="stat-value" id="statDiscount">—</p><p class="stat-sub">Items + receipts</p></div></div></div>
            <div class="col"><div class="card h-100"><div class="card-body py-3"><p class="stat-label">Adjustments</p><p class="stat-value" id="statAdjust">—</p><p class="stat-sub">+ extra / − short</p></div></div></div>
          </section>

          <!-- 3. Tabs + table -->
          <section class="card">
            <div class="card-header panel-head">
              <div class="nav nav-pills" id="reportTabs" role="tablist" aria-label="Report views">
                <button type="button" class="nav-link active" role="tab" data-tab="daily" aria-selected="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>Daily
                </button>
                <button type="button" class="nav-link" role="tab" data-tab="category" aria-selected="false">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"></path><circle cx="7" cy="7" r="1.5"></circle></svg>By category
                </button>
                <button type="button" class="nav-link" role="tab" data-tab="items" aria-selected="false">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"></path><path d="m3 8 9 5 9-5M12 13v8"></path></svg>By item
                </button>
                <button type="button" class="nav-link" role="tab" data-tab="voided" aria-selected="false">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m5.6 5.6 12.8 12.8"></path></svg>Voided
                </button>
              </div>

              <div class="d-flex align-items-center gap-2 ms-auto">
                <div class="d-flex align-items-center gap-2" id="dailyTools">
                  <label class="form-label mb-0" for="groupBy">Group by</label>
                  <select class="form-select form-select-sm w-auto" id="groupBy"><option value="day">Day</option><option value="month">Month</option></select>
                </div>

                <!-- Export (report-export.js) -->
                <div class="dropdown">
                  <button type="button" class="btn btn-outline-primary btn-sm d-inline-flex align-items-center gap-1" data-bs-toggle="dropdown" aria-expanded="false" id="btnExport">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"></path></svg>Export
                  </button>
                  <ul class="dropdown-menu dropdown-menu-end">
                    <li><button type="button" class="dropdown-item" id="btnExportPdf">PDF</button></li>
                    <li><button type="button" class="dropdown-item" id="btnExportXlsx">Excel (.xlsx)</button></li>
                  </ul>
                </div>
              </div>
            </div>
            <div class="table-responsive">
              <table class="table table-hover mb-0">
                <thead id="reportHead"></thead>
                <tbody id="reportBody"><tr><td class="empty">Loading…</td></tr></tbody>
                <tfoot id="reportFoot" class="table-group-divider fw-bold"></tfoot>
              </table>
            </div>
            <p class="small px-3 py-2 mb-0 border-top hidden" id="tabNote"></p>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/config.js"></script>
  <script src="../assets/js/supabaseClient.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/sidebar.js?v=2"></script>
  <script src="../assets/js/ui.js?v=4"></script>
  <script src="../assets/js/reports.js?v=3"></script>
  <script src="../assets/js/report-export.js?v=3"></script>
</body>
</html>
